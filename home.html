<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LingoEnglish - Home</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    <style>
      .home-container {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .home-card {
        width: min(700px, 100%);
        background: rgba(255, 255, 255, 0.95);
        border: 1px solid var(--border);
        border-radius: 24px;
        box-shadow: 0 20px 45px rgba(77, 163, 255, 0.18);
        padding: 56px 40px;
        text-align: center;
      }

      .home-card h1 {
        font-size: clamp(2rem, 4vw, 2.5rem);
        margin: 0 0 16px;
        color: var(--text);
      }

      .home-card p {
        font-size: 1rem;
        line-height: 1.7;
        color: var(--muted);
        margin-bottom: 40px;
      }

      .button-group {
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
        justify-content: center;
      }

      .home-button {
        display: inline-block;
        padding: 14px 32px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: var(--white);
        text-decoration: none;
        border-radius: 12px;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        border: none;
        cursor: pointer;
        font-size: 1rem;
      }

      .home-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px rgba(77, 163, 255, 0.3);
      }

      .home-button.secondary {
        background: var(--white);
        color: var(--primary);
        border: 2px solid var(--primary);
      }

      .home-button.secondary:hover {
        background: var(--accent);
      }

      @media (max-width: 640px) {
        .home-card {
          padding: 40px 24px;
        }

        .button-group {
          flex-direction: column;
        }

        .home-button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="home.html">LINGOENGLISH</a>
      <nav>
        <a class="nav-link" href="index.html">About</a>
        <a class="nav-link" href="impact.html">Impact</a>
        <a class="nav-link" href="signup.html">Sign Up</a>
      </nav>
    </header>

    <div class="home-container">
      <section class="home-card">
        <p class="eyebrow">Welcome</p>
        <h1>LingoEnglish Community</h1>
        <p>
          Bridge the gap between knowing English and speaking it with confidence. Join our community
          of learners, volunteers, and professionals.
        </p>

        <div class="button-group">
            <a href="index.html" class="home-button secondary">About Us</a>
            <a href="impact.html" class="home-button">Impact</a>
            <a href="signup.html" class="home-button">Sign Up</a>
        </div>
      </section>
    </div>
  </body>
</html>
